[versions]
# Shaded
adventureFloor = "4.20.0"              # what Paper at our floor (1.21.4) provides at runtime; see common's adventureFloorCheck
adventurePlatform = "4.4.1"            # https://github.com/KyoriPowered/adventure-platform # archived; the last Adventure 4 line
adventureBundled = "4.26.1"            # the Adventure the Bukkit distribution BUNDLES - see bukkit/build.gradle.kts
adventure = "5.2.0"                    # https://github.com/PaperMC/adventure/releases # Java 21 bytecode; downgraded for the Bukkit distribution
annotations = "26.1.0"                 # https://github.com/JetBrains/java-annotations/releases
configlib = "4.6.0"                    # https://github.com/tomwmth/ConfigLib
dbcp2 = "2.14.0"                       # https://commons.apache.org/proper/commons-dbcp/changes.html
litecommands = "3.11.0"                # https://github.com/Rollczi/LiteCommands/releases # Java 17 bytecode; downgraded for the Bukkit distribution
localelib = "4.1.5"                    # https://github.com/PikaMug/LocaleLib/releases
lombok = "1.18.46"                     # https://projectlombok.org/changelog
testng = "7.5.1"                       # https://github.com/testng-team/testng/releases # NOTE: v7.6+ requires JDK 11
xseries = "13.7.1"                     # https://github.com/CryptoMorin/XSeries/releases

# Bukkit/Spigot/Paper
spigot = "1.8.8-R0.1-SNAPSHOT"         # https://www.spigotmc.org/
paper = "26.2.build.87-stable"         # https://papermc.io/downloads/all?project=paper # newest; used only by common's modern-API check
paperFloor = "1.21.4-R0.1-SNAPSHOT"    # the Paper distribution's floor. 1.21 flipped InventoryView to an interface
                                       # and 1.21.4 added Enchantment#description(); both are required. jvm.version 21.
placeholderapi = "2.11.6"              # https://github.com/PlaceholderAPI/PlaceholderAPI/releases
vault = "1.7.1"                        # https://github.com/MilkBowl/VaultAPI
viaversion = "5.11.0"                  # https://github.com/ViaVersion/ViaVersion/releases # example plugin only

# Bundled with Spigot 1.8.8-R0.1
lang = "2.6"
gson = "2.2.4"
guava = "17.0"

# Gradle
blossom = "2.2.0"                     # https://github.com/KyoriPowered/blossom/releases
ideaExt = "1.4.1"                     # https://github.com/jetbrains/gradle-idea-ext-plugin
hangarPublish = "0.1.4"               # https://github.com/HangarMC/hangar-publish-plugin
mavenPublish = "0.37.0"               # https://github.com/vanniktech/gradle-maven-publish-plugin/releases
minotaurPublish = '2.+'               # https://github.com/modrinth/minotaur/releases
jvmdowngrader = "1.3.6"               # https://github.com/unimined/JvmDowngrader/releases
shadow = "9.6.1"                      # https://github.com/GradleUp/shadow/releases
spotless = "8.9.0"                    # https://github.com/diffplug/spotless/releases

[libraries]
adventure-bom = { group = "net.kyori", name = "adventure-bom", version.ref = "adventure" }
adventure-bom-floor = { group = "net.kyori", name = "adventure-bom", version.ref = "adventureFloor" }
adventure-platform-bukkit = { group = "net.kyori", name = "adventure-platform-bukkit", version.ref = "adventurePlatform" }
adventure-api.module = "net.kyori:adventure-api"
adventure-text-minimessage.module = "net.kyori:adventure-text-minimessage"
adventure-text-serializer-plain.module = "net.kyori:adventure-text-serializer-plain"
adventure-text-serializer-legacy.module = "net.kyori:adventure-text-serializer-legacy"
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }
configlib-yaml = { group = "dev.tomwmth.configlib", name = "configlib-yaml", version.ref = "configlib" }
configlib-bukkit = { group = "dev.tomwmth.configlib", name = "configlib-bukkit", version.ref = "configlib" }
dbcp2 = { group = "org.apache.commons", name = "commons-dbcp2", version.ref = "dbcp2" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
lang = { group = "commons-lang", name = "commons-lang", version.ref = "lang" }
litecommands-adventure = { group = "dev.rollczi", name = "litecommands-adventure", version.ref = "litecommands" }
litecommands-bukkit = { group = "dev.rollczi", name = "litecommands-bukkit", version.ref = "litecommands" }
litecommands-folia = { group = "dev.rollczi", name = "litecommands-folia", version.ref = "litecommands" }
localelib = { group = "com.github.PikaMug", name = "LocaleLib", version.ref = "localelib" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
paper-api-floor = { group = "io.papermc.paper", name = "paper-api", version.ref = "paperFloor" }
folia-scheduler-api = { group = "io.papermc.paper", name = "paper-api", version = "1.20.6-R0.1-SNAPSHOT" }
protocollib = { group = "com.comphenix.protocol", name = "ProtocolLib", version = "5.3.0" }
placeholderapi = { group = "me.clip", name = "placeholderapi", version.ref = "placeholderapi" }
spigot-api = { group = "org.spigotmc", name = "spigot-api", version.ref = "spigot" }
testng = { group = "org.testng", name = "testng", version.ref = "testng" }
vault-api = { group = "com.github.MilkBowl", name = "VaultAPI", version.ref = "vault" }
viaversion-api = { group = "com.viaversion", name = "viaversion-api", version.ref = "viaversion" }
xseries = { group = "com.github.cryptomorin", name = "XSeries", version.ref = "xseries" }

# Gradle
blossom-plugin = { module = "net.kyori.blossom:net.kyori.blossom.gradle.plugin", version.ref = "blossom" }
idea-ext-plugin = { module = "org.jetbrains.gradle.plugin.idea-ext:org.jetbrains.gradle.plugin.idea-ext.gradle.plugin", version.ref = "ideaExt" }
hangar-publish-plugin = { module = "io.papermc.hangar-publish-plugin:io.papermc.hangar-publish-plugin.gradle.plugin", version.ref = "hangarPublish" }
maven-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }
minotaur-publish-plugin = { module = "com.modrinth.minotaur:com.modrinth.minotaur.gradle.plugin", version.ref = "minotaurPublish" }
jvmdowngrader-plugin = { module = "xyz.wagyourtail.jvmdowngrader:xyz.wagyourtail.jvmdowngrader.gradle.plugin", version.ref = "jvmdowngrader" }
shadow-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }