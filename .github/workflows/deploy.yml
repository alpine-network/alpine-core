name: "Deploy"

on:
  workflow_dispatch: # manually triggered
  push:
    branches: [master]
    paths:
      - '**/*.java'
      - '**/*.toml'
      - '**/*.kts'
      - '**/*.yml'
      - 'gradle.properties'
      - 'gradle/wrapper/**'

jobs:
  build_deploy:
    if: >-
      github.repository_owner == 'alpine-network'
      && (github.ref_name == 'master' || github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # https://github.com/actions/checkout/releases
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/actions/setup-java/releases
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # 8 is required by `downgradedTest`, which runs the downgraded archive on a real Java 8
          # JVM; 25 is the Gradle toolchain. Order matters - setup-java points JAVA_HOME at the last
          # entry, and Gradle itself must run on 25.
          java-version: |
            8
            25
          check-latest: true

      # https://github.com/gradle/actions/releases
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          gradle-version: wrapper
          cache-disabled: false
          cache-provider: basic # MIT-licensed implementation

      - run: ./gradlew build --full-stacktrace

      - run: ./gradlew publishAllPublicationsToAlpineCloudRepository --full-stacktrace
        env:
          ALPINE_MAVEN_NAME: ${{ secrets.ALPINE_MAVEN_NAME }}
          ALPINE_MAVEN_SECRET: ${{ secrets.ALPINE_MAVEN_SECRET }}

      - run: ./gradlew publishPluginPublicationToHangar --full-stacktrace
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}

      - run: ./gradlew modrinth --full-stacktrace
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - run: ./gradlew modrinthSyncBody --full-stacktrace
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        continue-on-error: true

      - name: "set version"
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          RELEASE_VERSION=$(./gradlew properties --full-stacktrace -q | grep -m1 '^version:' | awk '{print $2}')
          if [[ -z "$RELEASE_VERSION" ]]; then
            echo "Error: unable to parse version from gradle properties."
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

      # https://github.com/softprops/action-gh-release/releases
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        if: github.event_name == 'workflow_dispatch' && !contains(env.RELEASE_VERSION, '-')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: v${{ env.RELEASE_VERSION }}
          files: |
            bukkit/build/libs/AlpineCore-Bukkit-${{ env.RELEASE_VERSION }}.jar
            paper/build/libs/AlpineCore-Paper-${{ env.RELEASE_VERSION }}.jar
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false
          draft: true
