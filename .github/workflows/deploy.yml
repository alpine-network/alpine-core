name: "Deploy"

on:
  workflow_dispatch: # manually triggered
  push:
    branches: [master]
    paths:
      - '**/*.java'
      - '**/*.toml'

jobs:
  build_deploy:
    if: github.repository_owner == 'alpine-network' && github.ref_name == 'master'

    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: "Checkout"
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: "Prepare JDK"
        # https://github.com/actions/setup-java/releases
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21
          check-latest: true

      - name: "Prepare Gradle"
        # https://github.com/gradle/actions/releases
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          validate-wrappers: true
          gradle-version: wrapper
          cache-disabled: false
          cache-provider: basic # MIT-licensed implementation

      - name: "Build Project"
        run: ./gradlew build --full-stacktrace

      - name: "Publish to Maven"
        run: ./gradlew publishAllPublicationsToAlpineCloudRepository --full-stacktrace
        env:
          ALPINE_MAVEN_NAME: ${{ secrets.ALPINE_MAVEN_NAME }}
          ALPINE_MAVEN_SECRET: ${{ secrets.ALPINE_MAVEN_SECRET }}

      - name: "Publish to Hangar"
        run: ./gradlew publishPluginPublicationToHangar --full-stacktrace
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}

      - name: "Publish to Modrinth"
        run: ./gradlew modrinth --full-stacktrace
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: "Sync Modrinth README"
        run: ./gradlew modrinthSyncBody --full-stacktrace
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        continue-on-error: true

      - name: "Read Version"
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          RELEASE_VERSION=$(./gradlew properties --full-stacktrace | grep "version:" | awk '{print $2}')
          if [[ -z "$RELEASE_VERSION" ]]; then
            echo "Error: unable to parse version from gradle properties."
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

      - name: "Create GitHub Release"
        if: github.event_name == 'workflow_dispatch' && !contains(env.RELEASE_VERSION, '-')
        # https://github.com/softprops/action-gh-release/releases
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: v${{ env.RELEASE_VERSION }}
          files: |
            bukkit/build/libs/AlpineCore-${{ env.RELEASE_VERSION }}.jar
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false
          draft: true
